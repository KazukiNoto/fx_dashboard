<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Dashboard</title>
  <meta name="theme-color" content="#131722">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FX Dashboard</h1>
    <nav id="pairs" aria-label="通貨ペア"></nav>
    <div id="sessions" aria-label="相場時間"><span id="session-phase" aria-live="polite"></span></div>
    <div id="menu-wrap">
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="メニュー" title="メニュー">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div id="menu" hidden>
        <button id="wake-toggle" type="button" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <span class="menu-label">画面を消さない</span>
          <span class="menu-state" id="wake-state">オフ</span>
        </button>
        <button id="refresh-app" type="button" title="Service Worker とキャッシュを消して読み込み直す">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
          <span class="menu-label">アプリを更新</span>
        </button>
      </div>
    </div>
  </header>
  <main>
    <div id="chart" class="tradingview-widget-container"></div>
    <section id="markets" aria-label="米金利・原油"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
