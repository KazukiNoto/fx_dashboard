<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Dashboard</title>
  <meta name="theme-color" content="#131722">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FX Dashboard</h1>
    <nav id="pairs" aria-label="通貨ペア"></nav>
    <div id="sessions" aria-label="相場時間"><time id="clock"></time></div>
    <button id="calendar-toggle" type="button" aria-pressed="false" aria-controls="calendar" aria-label="経済指標カレンダー" title="経済指標カレンダー">📅</button>
  </header>
  <div id="ticker" aria-label="価格一覧"></div>
  <main>
    <div id="chart" class="tradingview-widget-container"></div>
    <aside id="calendar" aria-label="経済指標カレンダー" hidden></aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
