<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FX Dashboard</title>
  <meta name="theme-color" content="#131722">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FX Dashboard</h1>
    <nav id="pairs" aria-label="通貨ペア"></nav>
    <div id="sessions" aria-label="相場時間"><span id="session-phase" aria-live="polite"></span><time id="clock"></time></div>
    <button id="wake-toggle" type="button" aria-pressed="false" aria-label="画面を消さない" title="画面を消さない(オフ)" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
    </button>
  </header>
  <main>
    <div id="chart" class="tradingview-widget-container"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
