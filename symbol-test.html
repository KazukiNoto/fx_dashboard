<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>シンボル確認</title>
  <style>
    body { margin: 0; padding: 8px; background: #131722; color: #e6e6e6; font-family: system-ui, sans-serif; }
    h1 { font-size: 1rem; margin: 4px 0 8px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
    .cell { height: 150px; position: relative; }
    .cell .tag { position: absolute; left: 4px; bottom: 0; font-size: 11px; opacity: .8; z-index: 1; }
    .cell .tradingview-widget-container, .cell .tradingview-widget-container__widget { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <h1>シンボル確認(出ないものは「TradingView上でのみ」などと表示される)</h1>
  <div id="grid"></div>
  <script>
    // 上の2つは動作確認用(出るはず)。残りが米金利の候補
    const SYMBOLS = [
      "FX_IDC:USDJPY", "TVC:USOIL",
      "CBOT:ZN1!", "CBOT:ZT1!", "CBOT:ZB1!",
      "CBOT:10Y1!", "CBOT:2YY1!",
      "OANDA:USB10Y_USD", "OANDA:USB02Y_USD", "OANDA:USB30Y_USD",
      "CBOE:TNX", "CBOE:FVX", "CBOE:TYX",
      "TVC:US10Y", "TVC:US02Y", "FRED:DGS10", "FRED:DGS2",
    ];
    const grid = document.getElementById("grid");
    for (const symbol of SYMBOLS) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = symbol;
      const container = document.createElement("div");
      container.className = "tradingview-widget-container";
      const widget = document.createElement("div");
      widget.className = "tradingview-widget-container__widget";
      container.append(widget);
      const script = document.createElement("script");
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js";
      script.async = true;
      script.textContent = JSON.stringify({
        symbol, width: "100%", height: "100%", locale: "ja", dateRange: "1D",
        colorTheme: "dark", isTransparent: true, autosize: true, largeChartUrl: "",
      });
      container.append(script);
      cell.append(container, tag);
      grid.append(cell);
    }
  </script>
</body>
</html>
